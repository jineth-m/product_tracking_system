{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Product Ranges</h2>

<div class="row">

    <!-- LOCAL COLUMN -->
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white text-center">
                <strong>Local</strong>
            </div>

            <div class="list-group list-group-flush">

                {% for row in rows %}
                    {% if row.local %}
                        <a href="{% url 'products_by_range' row.local.id %}"
                           class="list-group-item list-group-item-action text-center">
                            {{ row.local.name }}
                        </a>
                    {% endif %}
                {% endfor %}

            </div>
        </div>
    </div>

    <!-- EXPORT COLUMN -->
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white text-center">
                <strong>Export</strong>
            </div>

            <div class="list-group list-group-flush">

                {% for row in rows %}
                    {% if row.export %}
                        <a href="{% url 'products_by_range' row.export.id %}"
                           class="list-group-item list-group-item-action text-center">
                            {{ row.export.name }}
                        </a>
                    {% endif %}
                {% endfor %}

            </div>
        </div>
    </div>

</div>

{% endblock %}
