{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Product Ranges</h2>

<style>
.range-cell {
    cursor: pointer;
    height: 60px;
    vertical-align: middle !important;
    font-weight: 500;
    transition: background 0.15s ease-in-out;
}

.range-cell:hover {
    background-color: #f0f0f0;
}
</style>

<table class="table table-bordered text-center table-hover">
    <thead class="table-dark">
        <tr>
            <th style="width: 50%;">Local</th>
            <th style="width: 50%;">Export</th>
        </tr>
    </thead>

    <tbody>
        {% for row in rows %}
        <tr>

            <!-- LOCAL CELL -->
            <td class="range-cell"
                {% if row.local %}
                onclick="window.location.href='{% url 'products_by_range' row.local.id %}'"
                {% endif %}>
                {% if row.local %}
                    {{ row.local.name }}
                {% endif %}
            </td>

            <!-- EXPORT CELL -->
            <td class="range-cell"
                {% if row.export %}
                onclick="window.location.href='{% url 'products_by_range' row.export.id %}'"
                {% endif %}>
                {% if row.export %}
                    {{ row.export.name }}
                {% endif %}
            </td>

        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
