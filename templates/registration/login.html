{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">

        <h2>Login</h2>

        {% if form.errors %}
            <div class="login-error">
                Invalid username or password
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Username</label>
            {{ form.username }}

            <label for="id_password">Password</label>
            {{ form.password }}

            <button type="submit">Login</button>
        </form>

    </div>
</div>
{% endblock %}
